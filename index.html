<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Info</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --primary: #1e3a5f; --primary-light: #2d5a8e; --primary-dark: #0f2440;
            --accent: #3b82f6; --accent-glow: rgba(59,130,246,0.12);
            --success: #10b981; --success-dark: #059669;
            --warning: #f59e0b; --warning-dark: #d97706;
            --danger: #ef4444; --danger-dark: #b91c1c;
            --bg: #f0f4f8; --bg-card: #fff;
            --text-primary: #1a202c; --text-secondary: #64748b; --text-muted: #94a3b8;
            --border: #e2e8f0; --border-light: #f1f5f9;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.08);
            --radius-sm: 10px; --radius-md: 16px; --radius-lg: 22px; --radius-xl: 32px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); padding-bottom: 40px; color: var(--text-primary); min-height: 100vh; -webkit-font-smoothing: antialiased; }

        .container { max-width: 560px; margin: auto; padding: 0 16px; }

        .header { background: linear-gradient(135deg, var(--primary-dark), var(--primary), var(--primary-light)); padding: 26px 0 22px; margin-bottom: 24px; border-radius: 0 0 24px 24px; }
        .header-inner { max-width: 560px; margin: auto; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .header h1 { font-size: 1.5rem; font-weight: 800; color: #fff; letter-spacing: 0.5px; }
        .header .sub { font-size: 0.76rem; color: rgba(255,255,255,0.7); margin-top: 3px; }

        .lock-btn { display: inline-flex; align-items: center; gap: 7px; padding: 10px 18px; border-radius: 50px; border: 1.5px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.12); color: #fff; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 0.8rem; cursor: pointer; transition: all 0.25s; backdrop-filter: blur(6px); white-space: nowrap; }
        .lock-btn:hover { background: rgba(255,255,255,0.22); transform: translateY(-1px); }
        .lock-btn.unlocked { background: rgba(16,185,129,0.28); border-color: rgba(16,185,129,0.55); }

        .card { background: var(--bg-card); border-radius: var(--radius-lg); padding: 22px; box-shadow: var(--shadow-lg); margin-bottom: 20px; border: 1px solid var(--border-light); animation: slideUp 0.4s ease forwards; opacity: 0; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
        .card-title { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 0.98rem; color: var(--primary); margin-bottom: 18px; padding-bottom: 13px; border-bottom: 2px solid var(--border-light); }
        .card-title .title-icon { width: 34px; height: 34px; background: var(--accent-glow); border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 1.05rem; }

        label { display: block; font-weight: 600; font-size: 0.7rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; }
        select, input { width: 100%; padding: 13px 15px; border: 2px solid var(--border); border-radius: var(--radius-md); font-size: 15px; font-family: 'Inter', sans-serif; background: #f8fafc; margin-bottom: 15px; transition: all 0.25s; color: var(--text-primary); }
        select:focus, input:focus { outline: none; border-color: var(--accent); background: #fff; box-shadow: 0 0 0 4px var(--accent-glow); }
        select:disabled, input:disabled { opacity: 0.45; cursor: not-allowed; }
        input::placeholder { color: var(--text-muted); }

        .config-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        @media (max-width: 480px) { .config-grid { grid-template-columns: 1fr; } }
        .config-grid select { margin-bottom: 0; }

        .btn { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: #fff; border: none; padding: 12px 20px; border-radius: 50px; font-weight: 600; cursor: pointer; transition: all 0.25s; font-size: 0.86rem; font-family: 'Inter', sans-serif; display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 12px rgba(30,58,95,0.25); }
        .btn:hover { transform: translateY(-2px); }
        .btn-sm { padding: 9px 16px; font-size: 0.8rem; }
        .btn-success { background: linear-gradient(135deg, var(--success), var(--success-dark)); }
        .btn-danger { background: linear-gradient(135deg, var(--danger), var(--danger-dark)); }

        .type-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 50px; font-size: 0.74rem; font-weight: 700; text-transform: uppercase; margin-bottom: 15px; }
        .type-badge.rolls { background: linear-gradient(135deg, #fef3c7, #fde68a); color: #92400e; border: 1px solid #fcd34d; }
        .type-badge.rings { background: linear-gradient(135deg, #ede9fe, #ddd6fe); color: #5b21b6; border: 1px solid #c4b5fd; }

        .cap-chip { display: none; align-items: center; gap: 6px; padding: 8px 14px; border-radius: var(--radius-md); font-size: 0.76rem; font-weight: 600; margin-bottom: 15px; }
        .cap-chip.show { display: inline-flex; animation: fadeIn 0.3s ease; }
        .cap-chip.yes { background: linear-gradient(135deg, #fef3c7, #fde68a); color: #92400e; border: 1px solid #fcd34d; }
        .cap-chip.no { background: #f1f5f9; color: var(--text-muted); border: 1px solid var(--border); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

        .op-btns { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 8px; }
        .op-btn { padding: 16px 12px; border: 2px solid var(--border); border-radius: var(--radius-md); background: #f8fafc; cursor: pointer; text-align: center; font-family: 'Inter', sans-serif; transition: all 0.25s; animation: fadeIn 0.35s ease both; }
        .op-btn:hover { transform: translateY(-3px); border-color: var(--accent-light); box-shadow: var(--shadow-md); }
        .op-btn.active { border-color: var(--accent); background: var(--accent-glow); box-shadow: 0 0 0 3px var(--accent-glow); }
        .op-btn .op-icon { font-size: 1.6rem; display: block; margin-bottom: 7px; }
        .op-btn .op-name { font-weight: 700; font-size: 0.82rem; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px; }

        .fields-head-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .shared-count { display: inline-flex; align-items: center; gap: 6px; font-size: 0.76rem; font-weight: 600; color: var(--text-secondary); }
        .shared-count .count-num { font-family: 'IBM Plex Mono', monospace; color: var(--accent); font-weight: 700; font-size: 0.9rem; }
        .mode-chip { display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; border-radius: 50px; font-size: 0.7rem; font-weight: 700; }
        .mode-chip.view { background: #f1f5f9; color: var(--text-secondary); border: 1px solid var(--border); }
        .mode-chip.edit { background: linear-gradient(135deg, #d1fae5, #a7f3d0); color: #065f46; border: 1px solid #6ee7b7; }

        .fields-table { width: 100%; border-collapse: separate; border-spacing: 0 6px; margin-bottom: 15px; }
        .fields-table tr { background: #f8fafc; border-radius: var(--radius-sm); animation: fadeIn 0.3s ease; }
        .fields-table td { padding: 11px 12px; font-size: 0.86rem; vertical-align: middle; }
        .fields-table td.f-key { font-weight: 700; color: var(--primary); width: 40%; background: var(--accent-glow); border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
        .fields-table td.f-val { font-weight: 600; font-family: 'IBM Plex Mono', monospace; color: var(--text-primary); }
        .row-act-cell { width: 78px; text-align: right; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; white-space: nowrap; }
        .row-act { background: none; border: none; cursor: pointer; font-size: 0.92rem; padding: 5px 6px; border-radius: 7px; transition: all 0.2s; margin-left: 2px; vertical-align: middle; }
        .row-act.edit:hover { background: var(--accent-glow); transform: scale(1.1); }
        .row-act.del:hover { background: rgba(239,68,68,0.12); transform: scale(1.1); }
        .row-act.save { color: var(--success); font-weight: 800; font-size: 1rem; }
        .row-act.save:hover { background: rgba(16,185,129,0.12); }
        .row-act.cancel { color: var(--text-muted); font-size: 0.9rem; }
        .edit-val { width: 100%; padding: 8px 11px; border: 2px solid var(--accent); border-radius: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 0.86rem; margin: 0; background: #fff; }
        .edit-val:focus { box-shadow: 0 0 0 3px var(--accent-glow); }

        .add-field-box { background: #f8fafc; border-radius: var(--radius-md); padding: 15px; border: 1px dashed #cbd5e1; transition: all 0.25s; }
        .add-field-box:focus-within { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px var(--accent-glow); }
        .add-field-box h4 { font-size: 0.72rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 11px; }
        .add-field-row { display: flex; gap: 8px; margin-bottom: 10px; }
        .add-field-row input { flex: 1; margin-bottom: 0; padding: 10px 12px; font-size: 0.85rem; }

        .no-data { text-align: center; color: var(--text-muted); padding: 30px 20px; font-size: 0.86rem; }
        .no-data::before { content: '📋'; display: block; font-size: 2rem; margin-bottom: 10px; opacity: 0.5; }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.6); backdrop-filter: blur(8px); z-index: 1000; align-items: center; justify-content: center; animation: fadeIn 0.2s ease; }
        .modal-box { background: #fff; border-radius: var(--radius-xl); padding: 32px 28px; width: 88%; max-width: 380px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.25); animation: modalPop 0.3s cubic-bezier(0.34,1.56,0.64,1); }
        @keyframes modalPop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-box .modal-icon { width: 60px; height: 60px; background: linear-gradient(135deg, #fef3c7, #fde68a); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; margin: 0 auto 15px; }
        .modal-box h3 { font-size: 1.15rem; font-weight: 800; margin-bottom: 6px; color: var(--primary); }
        .modal-box p { color: var(--text-secondary); font-size: 0.86rem; margin-bottom: 18px; line-height: 1.5; }
        .modal-box input { text-align: center; letter-spacing: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 1.2rem; font-weight: 700; }
        .pass-error { display: none; color: var(--danger); font-size: 0.8rem; font-weight: 600; margin: -8px 0 14px; }
        .pass-error.show { display: block; animation: shake 0.4s ease; }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
        .m-actions { display: flex; gap: 9px; }
        .m-btn { flex: 1; padding: 12px; border-radius: 50px; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 0.85rem; cursor: pointer; border: none; transition: filter 0.15s, transform 0.15s; }
        .m-btn:hover { filter: brightness(1.05); transform: translateY(-1px); }
        .m-btn.confirm { background: var(--primary); color: #fff; }
        .m-btn.cancel { background: var(--border-light); color: var(--text-secondary); }

        .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(16px); background: var(--primary); color: #fff; padding: 12px 24px; border-radius: 50px; font-size: 0.85rem; font-weight: 600; opacity: 0; transition: all 0.3s ease; z-index: 1100; pointer-events: none; box-shadow: 0 8px 24px rgba(15,36,64,0.35); }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body>

<div class="header">
    <div class="header-inner">
        <div>
            <h1>Shared Info</h1>
            <div class="sub">Common parameters per stand & operation</div>
        </div>
        <button class="lock-btn" id="lockBtn" onclick="onLockClick()">🔒 Locked</button>
    </div>
</div>

<div class="container">
    <!-- Configuration -->
    <div class="card">
        <div class="card-title"><div class="title-icon">🏭</div><span>Configuration</span></div>
        <div class="config-grid">
            <div>
                <label>Mill</label>
                <select id="millSelect">
                    <option value="">—</option>
                    <option value="RM1">RM1</option>
                    <option value="RM2">RM2</option>
                    <option value="RM3">RM3</option>
                </select>
            </div>
            <div>
                <label>Size</label>
                <select id="sizeSelect" disabled><option value="">—</option></select>
            </div>
            <div>
                <label>Type</label>
                <select id="typeSelect" disabled><option value="">—</option></select>
            </div>
        </div>
    </div>

    <!-- Stand + Operation -->
    <div class="card" id="standCard" style="display:none;">
        <div class="card-title"><div class="title-icon">🔩</div><span>Stand & Operation</span></div>
        <div id="typeBadge" class="type-badge rolls">🔩 ROLLS</div>
        <label>Select Stand</label>
        <select id="standSelect" style="margin-bottom:10px;"><option value="">-- Select Stand --</option></select>
        <span class="cap-chip" id="capChip"></span>
        <div id="opSection" style="display:none;">
            <label>Operation</label>
            <div class="op-btns" id="opBtns"></div>
        </div>
    </div>

    <!-- Parameters -->
    <div class="card" id="fieldsCard" style="display:none;">
        <div class="card-title"><div class="title-icon">📋</div><span>Parameters</span></div>
        <div class="fields-head-row">
            <span class="shared-count" id="countInfo"></span>
            <span class="mode-chip view" id="modeChip">🔒 View only</span>
        </div>
        <table class="fields-table" id="fieldsTable"></table>
        <div id="emptyMsg" class="no-data" style="display:none;">No parameters yet.</div>
        <div id="addFieldWrap" style="display:none;">
            <div class="add-field-box">
                <h4>➕ Add Parameter</h4>
                <div class="add-field-row">
                    <input type="text" id="newKey" placeholder="Name (e.g. Template)">
                    <input type="text" id="newValue" placeholder="Value (e.g. 17)">
                </div>
                <button class="btn btn-sm btn-success" onclick="addField()" style="width:100%;">➕ Add Parameter</button>
            </div>
        </div>
    </div>
</div>

<!-- Password Modal -->
<div class="modal-overlay" id="passModal">
    <div class="modal-box">
        <div class="modal-icon">🔐</div>
        <h3>Enter Access Code</h3>
        <p>Enter the secret code to enable adding & editing.</p>
        <input type="password" id="passInput" placeholder="••••" inputmode="numeric" autocomplete="off">
        <div class="pass-error" id="passError">❌ Wrong code, try again.</div>
        <div class="m-actions">
            <button class="m-btn confirm" onclick="tryUnlock()">Unlock</button>
            <button class="m-btn cancel" onclick="closePassModal()">Cancel</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD8WYEYEPSmeVqXt7rQIlRSvbPtkHXuOOI",
        authDomain: "norocnc.firebaseapp.com",
        databaseURL: "https://norocnc-default-rtdb.firebaseio.com",
        projectId: "norocnc",
        storageBucket: "norocnc.firebasestorage.app",
        messagingSenderId: "495921952357",
        appId: "1:495921952357:web:53756c0e6735134ff7b88c"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const SECRET_CODE = '1990';

    const sizes = {
        RM1: ["RB12","RB14","RB16","RB20","RB25","RB32","RB40"],
        RM2: ["RD5.5","RD6","RD6.5","RD7","RD8","RD9","RD10"],
        RM3: ["RB8","RB10","RB12","RB14","RB16"]
    };
    const millTypeSupport = { RM1: ["ROLLS"], RM2: ["ROLLS","RINGS"], RM3: ["ROLLS","RINGS"] };
    const typeOperations = {
        ROLLS: [{id:'turning', label:'Turning', icon:'🔧'}, {id:'notching', label:'Notching', icon:'⚡'}],
        RINGS: [{id:'grinding', label:'Grinding', icon:'💎'}, {id:'notching', label:'Notching', icon:'⚡'}]
    };

    const millSel = document.getElementById("millSelect");
    const sizeSel = document.getElementById("sizeSelect");
    const typeSel = document.getElementById("typeSelect");
    const standCard = document.getElementById("standCard");
    const typeBadge = document.getElementById("typeBadge");
    const standSelect = document.getElementById("standSelect");
    const capChip = document.getElementById("capChip");
    const opSection = document.getElementById("opSection");
    const opBtns = document.getElementById("opBtns");
    const fieldsCard = document.getElementById("fieldsCard");
    const fieldsTable = document.getElementById("fieldsTable");
    const emptyMsg = document.getElementById("emptyMsg");
    const countInfo = document.getElementById("countInfo");
    const modeChip = document.getElementById("modeChip");
    const addFieldWrap = document.getElementById("addFieldWrap");

    let currentType = '';
    let notchingMap = {};
    let selectedStand = null;
    let selectedOp = null;
    let currentFields = {};
    let editingKey = null;
    let isUnlocked = sessionStorage.getItem('sharedUnlocked') === '1';

    function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function extractNum(str) { const m = (str||'').match(/\d+/); return m ? parseInt(m[0],10) : 0; }
    function getSharedRef() { return db.ref(`stands/${millSel.value}/${sizeSel.value}/sharedInfo`); }
    function toast(msg) {
        const t = document.getElementById("toast");
        t.textContent = msg; t.classList.add('show');
        clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.remove('show'), 2000);
    }

    // ===== Lock / Unlock =====
    function updateLockUI() {
        const btn = document.getElementById('lockBtn');
        if (isUnlocked) { btn.innerHTML = '🔓 Unlocked'; btn.classList.add('unlocked'); }
        else { btn.innerHTML = '🔒 Locked'; btn.classList.remove('unlocked'); }
        modeChip.className = 'mode-chip ' + (isUnlocked ? 'edit' : 'view');
        modeChip.innerHTML = isUnlocked ? '🔓 Editing enabled' : '🔒 View only';
        addFieldWrap.style.display = isUnlocked ? 'block' : 'none';
        renderFields(currentFields);
    }

    function onLockClick() {
        if (isUnlocked) {
            isUnlocked = false;
            sessionStorage.removeItem('sharedUnlocked');
            editingKey = null;
            updateLockUI();
            toast('Locked — view only');
        } else {
            openPassModal();
        }
    }

    function openPassModal() {
        document.getElementById('passInput').value = '';
        document.getElementById('passError').classList.remove('show');
        document.getElementById('passModal').style.display = 'flex';
        setTimeout(() => document.getElementById('passInput').focus(), 100);
    }
    function closePassModal() { document.getElementById('passModal').style.display = 'none'; }

    function tryUnlock() {
        const val = document.getElementById('passInput').value.trim();
        if (val === SECRET_CODE) {
            isUnlocked = true;
            sessionStorage.setItem('sharedUnlocked', '1');
            closePassModal();
            updateLockUI();
            toast('🔓 Editing enabled');
        } else {
            const err = document.getElementById('passError');
            err.classList.remove('show'); void err.offsetWidth; err.classList.add('show');
            document.getElementById('passInput').value = '';
            document.getElementById('passInput').focus();
        }
    }
    document.getElementById('passInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') tryUnlock(); });
    document.getElementById('passModal').addEventListener('click', (e) => { if (e.target === document.getElementById('passModal')) closePassModal(); });

    // ===== Config =====
    millSel.addEventListener("change", () => {
        const m = millSel.value;
        sizeSel.innerHTML = '<option value="">—</option>'; sizeSel.disabled = true;
        typeSel.innerHTML = '<option value="">—</option>'; typeSel.disabled = true;
        resetSelection();
        if (m && sizes[m]) {
            sizes[m].forEach(s => sizeSel.innerHTML += `<option value="${s}">${s}</option>`);
            sizeSel.disabled = false;
            const types = millTypeSupport[m] || [];
            typeSel.innerHTML = '<option value="">—</option>';
            types.forEach(t => typeSel.innerHTML += `<option value="${t}">${t}</option>`);
            typeSel.disabled = false;
            if (types.length === 1) { typeSel.value = types[0]; currentType = types[0]; onTypeReady(); }
        }
    });
    sizeSel.addEventListener("change", () => { if (sizeSel.value && typeSel.value) { currentType = typeSel.value; onTypeReady(); } });
    typeSel.addEventListener("change", () => { currentType = typeSel.value; if (currentType && sizeSel.value) onTypeReady(); else resetSelection(); });

    function resetSelection() {
        standCard.style.display = 'none';
        fieldsCard.style.display = 'none';
        selectedStand = null; selectedOp = null; editingKey = null; currentFields = {};
    }

    function onTypeReady() {
        resetSelection();
        standCard.style.display = 'block';
        typeBadge.className = `type-badge ${currentType.toLowerCase()}`;
        typeBadge.innerHTML = currentType === 'ROLLS' ? '🔩 ROLLS' : '💍 RINGS';
        loadStands();
    }

    // ===== Load stands (names + notching capability), incl. COM =====
    function loadStands() {
        const base = `stands/${millSel.value}/${sizeSel.value}`;
        standSelect.disabled = true;
        standSelect.innerHTML = '<option value="">Loading…</option>';

        let promise;
        if (currentType === 'ROLLS') {
            promise = Promise.all([
                db.ref(`${base}/ROLLS`).once('value'),
                db.ref('comStands').once('value')
            ]).then(([rollsSnap, comSnap]) => {
                const names = new Set(); notchingMap = {};
                const rd = rollsSnap.val() || {};
                Object.values(rd).forEach(st => { if (st.standNumber) { names.add(st.standNumber); if (st.supportsNotching === true) notchingMap[st.standNumber] = true; } });
                const combo = `${millSel.value}_${sizeSel.value}`;
                const cd = comSnap.val() || {};
                Object.values(cd).forEach(st => {
                    if (st.combos && st.combos[combo] && st.standNumber) { names.add(st.standNumber); if (st.supportsNotching === true) notchingMap[st.standNumber] = true; }
                });
                return [...names];
            });
        } else {
            promise = db.ref(`${base}/RINGS_families`).once('value').then(snap => {
                const fams = snap.val() || {};
                const fids = Object.keys(fams);
                if (!fids.length) return [];
                return Promise.all(fids.map(fid => db.ref(`${base}/RINGS_families/${fid}/stands`).once('value'))).then(snaps => {
                    const names = new Set(); notchingMap = {};
                    snaps.forEach(sn => {
                        const d = sn.val() || {};
                        Object.values(d).forEach(st => { if (st.standNumber) { names.add(st.standNumber); if (st.supportsNotching === true) notchingMap[st.standNumber] = true; } });
                    });
                    return [...names];
                });
            });
        }

        promise.then(names => {
            names.sort((a,b) => extractNum(a) - extractNum(b));
            standSelect.innerHTML = '<option value="">-- Select Stand --</option>';
            if (names.length === 0) { standSelect.innerHTML = '<option value="">No stands found</option>'; return; }
            standSelect.disabled = false;
            names.forEach(n => standSelect.innerHTML += `<option value="${esc(n)}">${esc(n)}</option>`);
        });
    }

    standSelect.addEventListener("change", function() {
        selectedStand = this.value;
        selectedOp = null; editingKey = null;
        fieldsCard.style.display = 'none';
        opSection.style.display = 'none';
        capChip.classList.remove('show');
        if (!selectedStand) return;

        const supportsNotching = notchingMap[selectedStand] === true;
        capChip.className = 'cap-chip show ' + (supportsNotching ? 'yes' : 'no');
        capChip.innerHTML = supportsNotching ? '⚡ Notching capable' : '🔧 Standard stand — no Notching';

        let ops = typeOperations[currentType] || [];
        if (!supportsNotching) ops = ops.filter(op => op.id !== 'notching');

        opBtns.innerHTML = '';
        ops.forEach((op, i) => {
            const b = document.createElement('button');
            b.className = 'op-btn';
            b.style.animationDelay = (i * 70) + 'ms';
            b.innerHTML = `<span class="op-icon">${op.icon}</span><span class="op-name">${op.label}</span>`;
            b.addEventListener('click', () => {
                opBtns.querySelectorAll('.op-btn').forEach(x => x.classList.remove('active'));
                b.classList.add('active');
                selectedOp = op.id; editingKey = null;
                fieldsCard.style.display = 'block';
                loadFields();
            });
            opBtns.appendChild(b);
        });
        opSection.style.display = 'block';
    });

    // ===== Fields =====
    function loadFields() {
        if (!selectedStand || !selectedOp) return;
        getSharedRef().child(`${selectedStand}/${selectedOp}`).once('value').then(snap => {
            currentFields = snap.val() || {};
            renderFields(currentFields);
        });
    }

    function renderFields(fields) {
        const entries = Object.entries(fields);
        countInfo.innerHTML = `<span class="count-num">${entries.length}</span> parameter${entries.length === 1 ? '' : 's'} · ${esc(selectedStand)} · ${esc(selectedOp)}`;
        addFieldWrap.style.display = isUnlocked ? 'block' : 'none';

        fieldsTable.innerHTML = '';
        if (entries.length === 0) {
            emptyMsg.style.display = 'block';
            return;
        }
        emptyMsg.style.display = 'none';

        entries.forEach(([k, v]) => {
            const tr = document.createElement('tr');
            if (isUnlocked && editingKey === k) {
                tr.innerHTML = `
                    <td class="f-key">${esc(k)}</td>
                    <td><input type="text" class="edit-val" value="${esc(v)}"></td>
                    <td class="row-act-cell">
                        <button class="row-act save" data-key="${esc(k)}" title="Save">✓</button>
                        <button class="row-act cancel" title="Cancel">✕</button>
                    </td>`;
            } else {
                let actCell = '';
                if (isUnlocked) {
                    actCell = `<td class="row-act-cell">
                        <button class="row-act edit" data-key="${esc(k)}" title="Edit">✏️</button>
                        <button class="row-act del" data-key="${esc(k)}" title="Delete">🗑️</button>
                    </td>`;
                }
                tr.innerHTML = `<td class="f-key">${esc(k)}</td><td class="f-val">${esc(v)}</td>${actCell}`;
            }
            fieldsTable.appendChild(tr);
        });

        if (isUnlocked && editingKey) {
            const inp = fieldsTable.querySelector('.edit-val');
            if (inp) { inp.focus(); inp.select(); }
        }
    }

    // Row actions (event delegation)
    fieldsTable.addEventListener('click', (e) => {
        const editBtn = e.target.closest('.row-act.edit');
        const delBtn = e.target.closest('.row-act.del');
        const saveBtn = e.target.closest('.row-act.save');
        const cancelBtn = e.target.closest('.row-act.cancel');
        if (editBtn) { editingKey = editBtn.dataset.key; renderFields(currentFields); }
        else if (delBtn) { deleteField(delBtn.dataset.key); }
        else if (saveBtn) { saveEdit(saveBtn.dataset.key); }
        else if (cancelBtn) { editingKey = null; renderFields(currentFields); }
    });

    fieldsTable.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && e.target.classList.contains('edit-val')) {
            const saveBtn = e.target.closest('tr').querySelector('.row-act.save');
            if (saveBtn) saveEdit(saveBtn.dataset.key);
        }
    });

    function saveEdit(key) {
        const inp = fieldsTable.querySelector('.edit-val');
        const newValue = inp.value.trim();
        if (!newValue) { alert('Value cannot be empty.'); return; }
        getSharedRef().child(`${selectedStand}/${selectedOp}/${key}`).set(newValue).then(() => {
            editingKey = null;
            toast('✓ Updated');
            loadFields();
        });
    }

    function deleteField(key) {
        if (!confirm(`Delete "${key}"?`)) return;
        getSharedRef().child(`${selectedStand}/${selectedOp}/${key}`).remove().then(() => {
            toast('🗑️ Deleted');
            loadFields();
        });
    }

    function addField() {
        if (!isUnlocked) return;
        if (!selectedStand || !selectedOp) return alert('Select a stand and operation first.');
        const k = document.getElementById('newKey').value.trim();
        const v = document.getElementById('newValue').value.trim();
        if (!k) return alert('Enter parameter name.');
        if (!v) return alert('Enter parameter value.');
        getSharedRef().child(`${selectedStand}/${selectedOp}/${k}`).set(v).then(() => {
            document.getElementById('newKey').value = '';
            document.getElementById('newValue').value = '';
            toast('✓ Added');
            loadFields();
        });
    }

    window.onload = () => { updateLockUI(); };
</script>
</body>
</html>
